<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Cadastro</title>
</head>
<body>
    <div layout:fragment="content">
        <h3 class="mb-4 text-center">Criar conta</h3>

        <form th:action="@{/cadastro}" th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}" class="form-control"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" autocomplete="name" required>
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" id="username" th:field="*{username}" class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" autocomplete="username" required>
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="email" required>
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control"
                       th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'" autocomplete="new-password" required>
                <div class="invalid-feedback" th:errors="*{senha}"></div>
                <div class="form-text">Mínimo de 8 caracteres, com maiúscula, minúscula e número.</div>
            </div>
            <div class="mb-3">
                <label for="confirmacaoSenha" class="form-label">Confirmar senha</label>
                <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmacaoSenha') or #fields.hasErrors('senhasConferem')} ? 'is-invalid'"
                       autocomplete="new-password" required>
                <div class="invalid-feedback" th:errors="*{confirmacaoSenha}"></div>
                <div class="invalid-feedback" th:errors="*{senhasConferem}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>

        <div class="mt-3 text-center">
            Já tem conta? <a th:href="@{/login}" class="text-decoration-none">Entrar</a>
        </div>
    </div>
</body>
</html>
