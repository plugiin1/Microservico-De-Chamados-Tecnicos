<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Chamados</title>
</head>
<body>
    <div layout:fragment="content" class="container mt-4">
        <h2 class="mb-4">Lista de Chamados</h2>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Status</th>
                        <th>Tipo</th>
                        <th>Técnico</th>
                        <th>Usuário</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="chamado : ${chamados}">
                        <td th:text="${chamado?.descricao}"></td>
                        <td th:text="${chamado?.status}"></td>
                        <td th:text="${chamado?.tipo}"></td>
                        <td th:text="${chamado?.tecnico}"></td>
                        <td th:text="${chamado?.usuario}"></td>
                        <td>
                            <a th:href="@{'/chamados/novo/'}" class="btn btn-primary btn-sm">Novo</a>
                            <a th:href="@{'/chamados/atualizar/' + ${chamado.id}}" class="btn btn-warning btn-sm">Editar</a>
                            <a th:href="@{'/chamados/cancelar/' + ${chamado.id}}" class="btn btn-danger btn-sm">Cancelar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
