<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:attr="data-bs-theme=${ui.modo}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE" th:text="${ui.nome}">Sistema</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/themes/{tema}/theme.css(tema=${ui.tema})}">
    </head>
    <body class="layout-auth">
        <div class="auth-container">
            <div class="auth-card">
                <div class="text-center">
                    <img th:src="@{${ui.logo}}" th:alt="${ui.nome}" class="auth-logo">
                </div>
                <div layout:fragment="content"></div>
            </div>
        </div>
    </body>
</html>
