<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3" th:text="${ui.nome}">Menu</h4>
                <div class="text-center small mb-3" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                    <span class="badge bg-secondary" sec:authorize="hasRole('ADMIN')">Administrador</span>
                    <span class="badge bg-secondary" sec:authorize="hasRole('TECNICO')">Técnico</span>
                    <span class="badge bg-secondary" sec:authorize="hasRole('CLIENTE')">Cliente</span>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados}">
                            <i class="bi bi-headset"></i> <span class="d-none d-md-inline">Chamados</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'TECNICO')">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person"></i> <span class="d-none d-md-inline">Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/usuarios}">
                            <i class="bi bi-people"></i> <span class="d-none d-md-inline">Usuários</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            Configurações
                            <span class="float-end">&#9662;</span>
                        </a>
                        <ul class="nav flex-column submenu">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/tecnicos}">
                                    <i class="bi bi-person"></i> <span class="d-none d-md-inline">Técnicos</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/tipo-chamado}">
                                    <i class="bi bi-megaphone"></i> <span class="d-none d-md-inline">Tipo de Chamado</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/ajustes-horarios}">
                                    <i class="bi bi-alarm"></i> <span class="d-none d-md-inline">Horário de Atendimento</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/recursos}">
                                    <i class="bi bi-screwdriver"></i> <span class="d-none d-md-inline">Recursos</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item mt-3 px-3">
                        <form th:action="@{/tema}" method="post">
                            <label for="tema" class="form-label small mb-1"><i class="bi bi-palette"></i> Tema</label>
                            <select id="tema" name="tema" class="form-select form-select-sm" data-auto-submit>
                                <option th:each="opcao : ${ui.temas}"
                                        th:value="${opcao.key}"
                                        th:text="${opcao.value.descricao}"
                                        th:selected="${opcao.key == ui.tema}"></option>
                            </select>
                        </form>
                    </li>
                    <li class="nav-item mt-3" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="nav-link btn btn-link text-start w-100">
                                <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Sair</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
