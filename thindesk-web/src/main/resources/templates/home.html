<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Início</title>
</head>
<body>
    <div layout:fragment="content" class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="text-center">
            <h1>Bem-vindo ao <span th:text="${ui.nome}">sistema</span></h1>
            <img th:src="@{${ui.logo}}" th:alt="${ui.nome}" class="img-fluid" style="max-width: 500px;">
        </div>
    </div>

</html>
