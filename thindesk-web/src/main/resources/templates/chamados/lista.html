<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Chamados</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid mt-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <h2 class="mb-0">Chamados</h2>
        <a th:href="@{/chamados/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Abrir chamado
        </a>
    </div>

    <div class="btn-group mb-3" role="group">
        <a th:href="@{/chamados}" class="btn btn-outline-secondary"
           th:classappend="${statusFiltro == null} ? 'active'">Todos</a>
        <a th:href="@{/chamados(status='ABERTO')}" class="btn btn-outline-secondary"
           th:classappend="${statusFiltro == 'ABERTO'} ? 'active'">Em aberto</a>
        <a th:href="@{/chamados(status='RESOLVIDO')}" class="btn btn-outline-secondary"
           th:classappend="${statusFiltro == 'RESOLVIDO'} ? 'active'">Resolvidos</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Título</th>
                    <th>Solicitante</th>
                    <th>Abertura</th>
                    <th>Técnico</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="chamado : ${chamados}">
                    <td th:text="${chamado.titulo}">Título</td>
                    <td th:text="${chamado.solicitante.username}">usuário</td>
                    <td th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}">—</td>
                    <td th:text="${chamado.tecnico != null} ? ${chamado.tecnico.username} : '—'">—</td>
                    <td>
                        <span class="badge"
                              th:classappend="${chamado.resolvido} ? 'text-bg-success' : 'text-bg-warning'"
                              th:text="${chamado.status}">STATUS</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/chamados/' + ${chamado.id}}" class="btn btn-sm btn-outline-primary">
                            Detalhes
                        </a>
                    </td>
                </tr>
                <tr th:if="${chamados.isEmpty()}">
                    <td colspan="6" class="text-center text-body-secondary py-4">
                        Nenhum chamado encontrado para este filtro.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
