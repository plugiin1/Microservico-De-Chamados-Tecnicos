spring.application.name=thindesk
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true

spring.session.mongodb.collection-name=sessoes
spring.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.pfc=DEBUG

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@thindesk.local}
app.admin.password=${ADMIN_PASSWORD:}

app.ui.nome=${APP_NOME:Thindesk}
app.ui.logo=/images/logo.png
app.ui.tema-padrao=${APP_TEMA:padrao}
app.ui.temas.padrao.descricao=Padr\u00e3o
app.ui.temas.padrao.modo=light
app.ui.temas.oceano.descricao=Oceano
app.ui.temas.oceano.modo=light
app.ui.temas.menta.descricao=Verde-Menta
app.ui.temas.menta.modo=light
app.ui.temas.escuro.descricao=Escuro
app.ui.temas.escuro.modo=dark
