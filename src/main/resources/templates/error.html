<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head>
    <title>Erro</title>
</head>
<body>
    <div layout:fragment="content" class="text-center">
        <h1 class="display-4" th:text="${status}">Erro</h1>
        <p class="lead" th:switch="${status}">
            <span th:case="404">Página não encontrada.</span>
            <span th:case="*">Ocorreu um erro inesperado. Tente novamente mais tarde.</span>
        </p>
        <a th:href="@{/}" class="btn btn-primary">Voltar ao início</a>
    </div>
</body>
</html>
