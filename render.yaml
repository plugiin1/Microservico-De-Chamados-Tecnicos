services:
  - type: web
    name: thindesk-chamados-service
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.chamados
    dockerContext: .
    healthCheckPath: /api/info
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: thindesk
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: thindesk-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: thindesk
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TIMEOUT
        value: 30m
      - key: APP_NOME
        value: Thindesk
      - key: APP_TEMA
        value: padrao
      - key: THYMELEAF_CACHE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: CHAMADOS_API_URL
        sync: false
